<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>try{var t=localStorage.getItem("vh-theme");document.documentElement.dataset.theme=(t==="dark"||t==="navy"||t==="light")?t:"light"}catch(e){}</script><meta name="robots" content="noindex,nofollow"><title>VAULT HAC Admin</title>
<style>
:root,:root[data-theme=light]{--c:#0066FF;--bg:#f3f7fb;--pn:#ffffff;--ln:#c9d7e5;--mu:#43566b;--tx:#0B0F14;--bt:#ffffff;--rd:#c62828;color-scheme:light}
:root[data-theme=dark]{--c:#00D1FF;--bg:#0B0F14;--pn:#060a10;--ln:#16314a;--mu:#9fb3c8;--tx:#eaf6ff;--bt:#021018;--rd:#f87171;color-scheme:dark}
:root[data-theme=navy]{--c:#22d3ee;--bg:#060d1f;--pn:#02060f;--ln:#12324f;--mu:#9db4c8;--tx:#eaf6ff;--bt:#021018;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:auto;max-width:760px;padding:0 14px 90px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
h1{color:var(--c);font-size:1.25rem;margin:0}p{color:var(--mu);margin:6px 0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.menu{position:relative}
#mm{position:absolute;right:0;top:46px;min-width:210px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px;box-shadow:0 8px 24px #0004}
#mm button{display:block;width:100%;text-align:left;margin:0;border:0;padding:12px}
#mm button+button{border-top:1px solid var(--ln)}
.box{border:1px solid var(--ln);border-radius:8px;background:var(--pn);padding:10px 12px;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:8px}
input,textarea,select{width:100%;padding:10px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
button{padding:10px 14px;margin:8px 8px 8px 0;border-radius:6px;border:1px solid var(--c);background:transparent;color:var(--c);font:inherit;font-weight:600;cursor:pointer}
button.main{background:var(--c);color:var(--bt)}button.del{border-color:var(--rd);color:var(--rd)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:10px 14px;border-top:1px solid var(--ln);display:flex;gap:10px;align-items:center;max-width:760px;margin:auto}
.bar button{margin:0;flex:0 0 auto}#st{color:var(--c);flex:1;font-size:.85rem;margin:0}
#sec{margin-top:14px;font-weight:700;color:var(--c)}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;color:var(--mu)}
.pill.on{border-color:var(--c);color:var(--c)}
.item{padding:6px 12px}.ih{display:flex;align-items:center;gap:6px;position:relative}
.tg{flex:1;text-align:left;border:0;margin:0;padding:12px 4px;color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw{position:relative}.dots{margin:0;border:0;font-size:1.4rem;line-height:1;padding:6px 12px;color:var(--mu)}
.dm{position:absolute;right:0;top:100%;z-index:4;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:4px;box-shadow:0 8px 24px #0004}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--ln);border-radius:6px;padding:4px 8px;margin:6px 0}.frow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow button{margin:0}.lab2{margin:12px 0 0}
.dm button{margin:0;border:0;padding:10px 18px}.ib{border-top:1px solid var(--ln);padding-bottom:8px}
a{color:var(--c)}[hidden]{display:none!important}
</style></head><body>
<div id="main" hidden>
<div class="top"><h1>VAULT HAC Admin</h1><div class="menu"><button id="mb" aria-haspopup="true">☰ Menu</button>
<div id="mm" hidden><label style="padding:6px 12px">Theme<select id="th"><option value="light">Light</option><option value="dark">Dark</option><option value="navy">Midnight</option></select></label><button id="dl">Download backup</button><button id="cp">Copy JSON</button><button id="rs">Discard draft</button><button id="lo">Log out</button></div></div></div>
<select id="sec" aria-label="Choose what to edit"></select>
<div id="app"></div>
<div class="bar"><button class="main" id="sv">Save to website</button><p id="st" role="status"></p></div>
</div>
<form id="login" style="padding-top:16px"><h1>VAULT HAC Admin</h1><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><button class="main" type="submit">Log in</button><p id="lerr" style="color:var(--rd)"></p></form>
<script>
let C={lessons:[],latest:{hac:[],disc:[]},platforms:[],faqs:[],formAction:""};
const $=s=>document.querySelector(s), DK="vh-admin-draft";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const okLink=u=>!u||/(?:v=|youtu\.be\/|shorts\/|embed\/)[\w-]{11}/.test(u);
const save=()=>{try{localStorage.setItem(DK,JSON.stringify(C))}catch(e){}};
const inp=(p,l,v,t)=>`<label>${l}<input data-p="${p}" type="${t||"text"}" value="${esc(v)}"></label>`;
const SECS=[["menu","Menu order"],["posts","Create post & updates"],["faqs","Answered questions"],["msgs","Visitor messages"],["lessons","Lesson videos"],["groups","Lesson groups"],["uploads","File uploads"],["hac","Latest videos: VAULT HAC"],["disc","Latest videos: VAULT DISCOVERIES"],["platforms","Online platforms"],["form","Message form link"]];
let cur=localStorage.getItem("vh-sec")||"menu";
$("#sec").innerHTML=SECS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
$("#sec").onchange=e=>{cur=e.target.value;try{localStorage.setItem("vh-sec",cur)}catch(x){}draw()};
$("#mm").onclick=e=>e.stopPropagation();
$("#th").value=document.documentElement.dataset.theme||"light";
$("#th").onchange=e=>{document.documentElement.dataset.theme=e.target.value;try{localStorage.setItem("vh-theme",e.target.value)}catch(x){}};
$("#mb").onclick=e=>{e.stopPropagation();$("#mm").hidden=!$("#mm").hidden};
document.addEventListener("click",()=>{$("#mm").hidden=true;closeDots()});
const OPEN=new Set();
function closeDots(){document.querySelectorAll(".dm").forEach(x=>x.hidden=true)}
const chk=(p,l,v)=>`<label><input type="checkbox" data-p="${p}" ${v?"checked":""}>${l}</label>`;
const item=(key,title,body,delA)=>`<div class="box item"><div class="ih"><button class="tg" data-a="tg" data-key="${key}">${OPEN.has(key)?"▾":"▸"} ${esc(title||"(untitled)")}</button><span class="dw"><button class="dots" data-a="dots" aria-label="More options">⋯</button><div class="dm" hidden><button class="del" ${delA}>Delete</button></div></span></div><div class="ib" ${OPEN.has(key)?"":"hidden"}>${body}</div></div>`;
const DG=[{id:"computer",name:"Computer basics"},{id:"digital",name:"Digital skills"},{id:"cyber",name:"Cybersecurity"},{id:"forex",name:"Forex"}];
const gopts=v=>C.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===v?"selected":""}>${esc(g.name)}</option>`).join("")+`<option value="" ${v?"":"selected"}>Other (no group)</option>`;
const LAB={home:"Home",updates:"Updates",lessons:"Lessons",latest:"Latest Videos",videos:"Video Lessons",channels:"YouTube Channels",platforms:"Online Platforms",help:"Ask a Question",about:"About",contact:"Contact",privacy:"Privacy"};
const OWNP=["updates","videos","channels"];
function fixMenu(){const seen=new Set(),out=[];(C.menu||[]).forEach(m=>{if(m&&LAB[m.id]&&!seen.has(m.id)){seen.add(m.id);out.push({id:m.id,show:m.id==="home"?true:m.show!==false})}});Object.keys(LAB).forEach(id=>{if(!seen.has(id))out.push({id,show:true})});C.menu=out}
function draw(){
  C.posts=C.posts||[];fixMenu();if(!C.groups)C.groups=DG.map(g=>({...g}));$("#sec").value=cur;
  const L=C.lessons.map((l,i)=>item(`lessons.${i}`,l.title,`${inp(`lessons.${i}.title`,"Lesson title",l.title)}<label>Group<select data-p="lessons.${i}.cat">${gopts(l.cat)}</select></label><label>Short explanation<textarea rows="3" data-p="lessons.${i}.text">${esc(l.text)}</textarea></label><label>Learning objectives (one per line)<textarea rows="3" data-goals="${i}">${esc((l.goals||[]).join("\n"))}</textarea></label>${inp(`lessons.${i}.video`,"YouTube link (the exact video)",l.video)}${inp(`lessons.${i}.videoTitle`,"Video title (optional)",l.videoTitle)}<p class="lab2"><b>Files (PDF, Word, Excel, PowerPoint and others)</b></p>${(l.files||[]).map((f,k)=>`<div class="frow"><span>${esc(f.name)}</span><button class="del" data-a="rmFile" data-i="${i}" data-k="${k}">Remove</button></div>`).join("")||"<p>No files yet.</p>"}<label>Upload from this phone<input type="file" data-up="${i}" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,image/*"></label><label>Or add a file by link (https://...)<input id="fl-${i}" placeholder="https://..."></label><label>Name shown on the website<input id="fn-${i}" placeholder="Lesson notes (PDF)"></label><button data-a="addFile" data-i="${i}">Add file link</button>`,`data-a="rmL" data-i="${i}"`)).join("")+`<div class="box"><b>Add a new lesson</b>${inp("n.title","Title","")}<label>Group<select id="nc">${gopts(C.groups[0]&&C.groups[0].id)}</select></label><label>Short explanation<textarea id="nt" rows="2"></textarea></label><label>Learning objectives (one per line)<textarea id="ng" rows="3"></textarea></label><label>YouTube link (optional, you can add it later)<input id="nv" placeholder="https://youtu.be/..."></label><label>Video title (optional)<input id="nvt"></label><button class="main" data-a="addL">Add lesson</button></div>`+(C.lessons.length?`<button class="del" data-a="clrL">Delete all lessons</button>`:"");
  const V=k=>(C.latest[k]||[]).map((v,i)=>item(`latest.${k}.${i}`,v.title,`${inp(`latest.${k}.${i}.url`,"YouTube link",v.url)}${inp(`latest.${k}.${i}.title`,"Title",v.title)}${inp(`latest.${k}.${i}.date`,"Date",v.date,"date")}`,`data-a="rmV" data-k="${k}" data-i="${i}"`)).join("")+`<button class="main" data-a="addV" data-k="${k}">Add video</button>`;
  const P=C.platforms.map((p,i)=>item(`platforms.${i}`,(p.live?"● ":"○ ")+(p.name||""),`${inp(`platforms.${i}.name`,"Platform",p.name)}${inp(`platforms.${i}.handle`,"Handle (for example @vaulthac)",p.handle)}${inp(`platforms.${i}.url`,"Profile link (optional if you filled the handle)",p.url)}${chk(`platforms.${i}.live`,"This account exists. Show it on the website",p.live)}`,`data-a="rmP" data-i="${i}"`)).join("")+`<button class="main" data-a="addP">Add platform</button>`;
  const F=C.faqs.map((f,i)=>item(`faqs.${i}`,(f.pub?"Public · ":"Private · ")+(f.q||""),`${inp(`faqs.${i}.q`,"Question",f.q)}<label>Answer<textarea rows="3" data-p="faqs.${i}.a">${esc(f.a)}</textarea></label>${chk(`faqs.${i}.pub`,"Public: show this answer on the website",f.pub)}`,`data-a="rmF" data-i="${i}"`)).join("")+`<button class="main" data-a="addF">Add answered question</button>`;
  const PO=`<div class="box"><b>New post</b><label>Type<select id="pt"><option value="text">Text</option><option value="story">Story (disappears after 24 hours)</option><option value="reel">Reel / video</option><option value="file">Photo or file</option></select></label>${inp("n.ptitle","Title","")}<label>Description<textarea id="pd" rows="3"></textarea></label><label>Video / photo / file link (https://...)<input id="pm" placeholder="YouTube link, or a link to your photo or file"></label><label><input type="checkbox" id="ppub" checked>Publish on the website</label><p>File upload from your phone comes next. For now paste a link.</p><button class="main" data-a="addPost">Post</button></div>`+C.posts.map((p,i)=>item(`posts.${i}`,(p.pub?"On website · ":"Hidden · ")+p.type+" · "+(p.title||""),`<p>${esc(p.desc)}</p>${chk(`posts.${i}.pub`,"Show on the website",p.pub)}<button data-a="shP" data-i="${i}">Share to other platforms</button>`,`data-a="rmPost" data-i="${i}"`)).join("");
  const GR=C.groups.map((g,i)=>item(`groups.${i}`,g.name,`${inp(`groups.${i}.name`,"Group name",g.name)}<p>${C.lessons.filter(l=>l.cat===g.id).length} lesson(s) in this group.</p>`,`data-a="rmG" data-i="${i}"`)).join("")+`<div class="box"><b>Add a new group</b>${inp("n.gname","Group name (for example: Programming)","")}<button class="main" data-a="addG">Add group</button></div>`;
  const MN="<p>Visitors first see the Home page. Pages marked (on Home) are shown on the Home screen in this order. Pages marked (own page) open only when tapped in the menu. Untick a page to remove it.</p>"+C.menu.map((m,i)=>`<div class="box item"><div class="ih"><span class="tg" style="cursor:default">${i+1}. ${esc(LAB[m.id])} <small style="color:var(--mu);font-weight:400">${m.id==="home"?"":(OWNP.includes(m.id)?"(own page)":"(on Home)")}</small></span><span style="display:flex;gap:4px"><button data-a="mu" data-i="${i}" ${i?"":"disabled"} aria-label="Move up">\u25B2</button><button data-a="md" data-i="${i}" ${i<C.menu.length-1?"":"disabled"} aria-label="Move down">\u25BC</button></span></div>${m.id==="home"?"<p>Home is the first page people see. It cannot be hidden.</p>":chk(`menu.${i}.show`,"Show this page in the menu",m.show)}</div>`).join("");
  let cl="",pr="";try{cl=localStorage.getItem("vh-cloud")||"";pr=localStorage.getItem("vh-preset")||""}catch(x){}
  const UP=`<p>Upload PDF, Word and other files from your phone to your lessons using a free Cloudinary account. These two values are saved on this phone only and are never put on the website.</p><div class="box"><label>Cloud name<input id="upc" value="${esc(cl)}" placeholder="for example dxyz123abc"></label><label>Unsigned upload preset name<input id="upp" value="${esc(pr)}" placeholder="for example vaulthac_files"></label><button class="main" data-a="saveUpl">Save upload settings</button></div><p>If you do not want to set this up, you can still attach any file to a lesson by pasting its https link (for example from Google Drive).</p>`;
  const S={uploads:UP,menu:MN,groups:GR,posts:PO,faqs:F,msgs:'<div id="msgs"></div>',lessons:L,hac:V("hac"),disc:V("disc"),platforms:P,form:`<p>Paste your Formspree form link so visitor messages reach your email. Leave empty to use the visitor's email app.</p>${inp("formAction","Form link",C.formAction)}`};
  $("#app").innerHTML=S[cur];showMsgs();
}
function setp(path,val){const k=path.split(".");let o=C;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
$("#app").addEventListener("input",e=>{const p=e.target.dataset.p;if(!p)return;if(p==="n.title"||p==="n.ptitle"||p==="n.gname")return;setp(p,e.target.type==="checkbox"?e.target.checked:e.target.value);save()});
$("#app").addEventListener("input",e=>{const g=e.target.dataset.goals;if(g===undefined)return;C.lessons[+g].goals=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);save()});
async function uploadFile(file){
  let cloud="",preset="";try{cloud=localStorage.getItem("vh-cloud")||"";preset=localStorage.getItem("vh-preset")||""}catch(x){}
  if(!cloud||!preset)throw new Error("Set up file uploads first (menu: File uploads), or add the file by link.");
  if(file.size>10*1024*1024)throw new Error("This file is bigger than 10 MB.");
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",preset);
  const r=await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(cloud)+"/auto/upload",{method:"POST",body:fd});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.secure_url)throw new Error((j.error&&j.error.message)||"Upload failed.");
  return j.secure_url}
$("#app").addEventListener("change",async e=>{const t=e.target;if(t.dataset.up===undefined||!t.files||!t.files[0])return;const i=+t.dataset.up,f=t.files[0];
  $("#st").textContent="Uploading "+f.name+" ...";
  try{const url=await uploadFile(f);(C.lessons[i].files=C.lessons[i].files||[]).push({name:f.name,url});OPEN.add(`lessons.${i}`);save();draw();$("#st").textContent="Uploaded. Tap Save to website to publish."}
  catch(x){t.value="";$("#st").textContent="";alert(x.message)}});
$("#app").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,k=b.dataset.k;
  const ask=m=>confirm(m||"Delete this? This cannot be undone.");
  if(a==="dots"){e.stopPropagation();const m=b.nextElementSibling,was=m.hidden;closeDots();m.hidden=!was;return}
  if(a==="tg"){const q=b.dataset.key;OPEN.has(q)?OPEN.delete(q):OPEN.add(q);draw();return}
  if(a==="rmL"){if(!ask("Delete this lesson?"))return;C.lessons.splice(i,1);OPEN.clear()}
  else if(a==="rmG"){const g=C.groups[i],n=C.lessons.filter(l=>l.cat===g.id).length;if(!ask(n?`Delete the group "${g.name}"? Its ${n} lesson(s) are kept and move to "Other lessons".`:`Delete the group "${g.name}"?`))return;C.lessons.forEach(l=>{if(l.cat===g.id)l.cat=""});C.groups.splice(i,1);OPEN.clear()}
  else if(a==="addG"){const t=document.querySelector('[data-p="n.gname"]').value.trim();if(!t){alert("Enter a group name.");return}C.groups.push({id:t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36),name:t});OPEN.clear();OPEN.add(`groups.${C.groups.length-1}`)}
  else if(a==="mu"){const t=C.menu[i];C.menu.splice(i,1);C.menu.splice(i-1,0,t)}
  else if(a==="md"){const t=C.menu[i];C.menu.splice(i,1);C.menu.splice(i+1,0,t)}
  else if(a==="rmFile"){if(!ask("Remove this file from the lesson?"))return;C.lessons[i].files.splice(+k,1);OPEN.add(`lessons.${i}`)}
  else if(a==="addFile"){const u=($("#fl-"+i).value||"").trim(),n=($("#fn-"+i).value||"").trim();if(!/^https:\/\//.test(u)){alert("The file link must start with https://");return}(C.lessons[i].files=C.lessons[i].files||[]).push({name:n||"Download file",url:u});OPEN.add(`lessons.${i}`)}
  else if(a==="saveUpl"){try{localStorage.setItem("vh-cloud",$("#upc").value.trim());localStorage.setItem("vh-preset",$("#upp").value.trim())}catch(x){}alert("Upload settings saved on this phone.");return}
  else if(a==="clrL"){if(!ask("Delete ALL lessons?")||!ask("Really delete every lesson? You will need to add them again."))return;C.lessons=[];OPEN.clear()}
  else if(a==="rmV"){if(!ask())return;C.latest[k].splice(i,1);OPEN.clear()}
  else if(a==="addV"){(C.latest[k]=C.latest[k]||[]).unshift({url:"",title:"",date:""});OPEN.clear();OPEN.add(`latest.${k}.0`)}
  else if(a==="rmP"){if(!ask())return;C.platforms.splice(i,1);OPEN.clear()}
  else if(a==="addP"){C.platforms.push({name:"",handle:"",url:"",live:false});OPEN.clear();OPEN.add(`platforms.${C.platforms.length-1}`)}
  else if(a==="rmF"){if(!ask())return;C.faqs.splice(i,1);OPEN.clear()}
  else if(a==="addF"){C.faqs.push({q:"",a:"",pub:false});OPEN.clear();OPEN.add(`faqs.${C.faqs.length-1}`)}
  else if(a==="addL"){const t=document.querySelector('[data-p="n.title"]').value.trim();if(!t){alert("Enter a lesson title.");return}
    C.lessons.push({id:t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36),cat:$("#nc").value,title:t,text:$("#nt").value.trim(),goals:$("#ng").value.split("\n").map(x=>x.trim()).filter(Boolean),channel:"hac",video:$("#nv").value.trim(),videoTitle:$("#nvt").value.trim(),files:[]});OPEN.clear();OPEN.add(`lessons.${C.lessons.length-1}`)}
  else if(a==="toFaq"){C.faqs.push({q:M[i].message.slice(0,200),a:"",pub:false});cur="faqs";OPEN.clear();OPEN.add(`faqs.${C.faqs.length-1}`);$("#st").textContent="Added. Write the answer, then switch Public on."}
  else if(a==="rmPost"){if(!ask("Delete this post?"))return;C.posts.splice(i,1);OPEN.clear()}
  else if(a==="shP"){const p=C.posts[i],t=p.title+"\n"+p.desc+(p.media?"\n"+p.media:"");if(navigator.share)navigator.share({title:p.title,text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>alert("Copied. Paste it into the platform."));return}
  else if(a==="addPost"){const t=document.querySelector('[data-p="n.ptitle"]').value.trim();if(!t){alert("Enter a title.");return}
    const m=$("#pm").value.trim();if(m&&!/^https:\/\//.test(m)){alert("The link must start with https://");return}
    const ty=$("#pt").value,now=Date.now();C.posts.unshift({id:"p"+now.toString(36),type:ty,title:t,desc:$("#pd").value.trim(),media:m,pub:$("#ppub").checked,date:new Date(now).toISOString().slice(0,10),expires:ty==="story"?now+864e5:0});OPEN.clear()}
  else if(a==="rmM"){if(!ask("Delete this message?"))return;fb.deleteDoc(fb.doc(db,"messages",M[i].id)).then(()=>{M.splice(i,1);OPEN.clear();showMsgs()}).catch(()=>alert("Could not delete."));return}
  else return;
  save();draw();
});
function fixPlatforms(){C.platforms.forEach(p=>{let u=String(p.url||"").trim();if(u&&!/^https?:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}/i.test(u))u="https://"+u;p.url=u;p.handle=String(p.handle||"").trim()})}
function problems(){fixPlatforms();const bad=[];C.lessons.forEach(l=>{if(!okLink(l.video))bad.push(l.title)});["hac","disc"].forEach(k=>(C.latest[k]||[]).forEach(v=>{if(!v.url||!okLink(v.url))bad.push(v.title||"A latest video")}));C.platforms.forEach(p=>{if(p.live&&!p.handle&&!p.url)bad.push((p.name||"A platform")+" is switched on. Add a handle or a link (either one).");if(p.live&&p.url&&!/^https:\/\//.test(p.url))bad.push((p.name||"A platform")+" link must start with https://")});return bad}
const out=()=>{const bad=problems();if(bad.length){alert("Fix these first:\n"+bad.join("\n"));return null}return JSON.stringify(C,null,1)};
$("#dl").onclick=()=>{const j=out();if(!j)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="content.json";a.click()};
$("#cp").onclick=async()=>{const j=out();if(!j)return;try{await navigator.clipboard.writeText(j);$("#st").textContent="Copied."}catch(e){$("#st").textContent="Copy failed. Use Download instead."}};
$("#rs").onclick=()=>{if(confirm("Discard your draft and reload from content.json?")){try{localStorage.removeItem(DK)}catch(e){}location.reload()}};
let M=[];
function showMsgs(){const e=$("#msgs");if(!e)return;e.innerHTML=M.length?M.map((m,i)=>item("m."+i,(m.type||"Message")+" · "+(m.name||"No name"),`${m.subject?`<p><b>${esc(m.subject)}</b></p>`:""}<p><a href="mailto:${esc(m.email)}?subject=${encodeURIComponent("Re: "+(m.subject||m.type||"Your message"))}">${esc(m.email)}</a></p><p style="color:var(--tx)">${esc(m.message)}</p><button data-a="toFaq" data-i="${i}">Use as FAQ question</button>`,`data-a="rmM" data-i="${i}"`)).join(""):"<p>No messages yet.</p>"}
const FB = {apiKey:"AIzaSyC1eHAw4SlWkldp7TYfOMVFrC3vPir6sLY",authDomain:"vaulthac-cb104.firebaseapp.com",projectId:"vaulthac-cb104",storageBucket:"vaulthac-cb104.firebasestorage.app",messagingSenderId:"594172120817",appId:"1:594172120817:web:7ef9c46604d63c25492350"};
const G = "https://www.gstatic.com/firebasejs/10.14.1";
let db,au,fb,fa;
async function start(){
  try{const A=await import(G+"/firebase-app.js");fb=await import(G+"/firebase-firestore.js");fa=await import(G+"/firebase-auth.js");
    const app=A.initializeApp(FB);db=fb.getFirestore(app);au=fa.getAuth(app);
    fa.onAuthStateChanged(au,u=>{$("#login").hidden=!!u;$("#main").hidden=!u;if(u)load()})}
  catch(e){$("#lerr").textContent="Could not load Firebase. Check your internet."}
}
async function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(DK))}catch(e){}
  if(d&&d.lessons&&confirm("Restore your unsaved draft from this phone?"))C=d;
  else try{const s=await fb.getDoc(fb.doc(db,"site","content"));
    if(s.exists()){C=JSON.parse(s.data().json);$("#st").textContent="Loaded your saved website content."}
    else{const r=await fetch("content.json",{cache:"no-store"});C=await r.json();$("#st").textContent="Nothing saved online yet. Tap Save to website to publish this content."}}
  catch(e){$("#st").textContent="Could not load content. Use the file picker above."}
  draw();loadMsgs()
}
async function loadMsgs(){try{const q=await fb.getDocs(fb.query(fb.collection(db,"messages"),fb.orderBy("created","desc"),fb.limit(50)));M=q.docs.map(x=>({id:x.id,...x.data()}))}catch(e){M=[]}showMsgs()}
$("#login").onsubmit=async e=>{e.preventDefault();try{await fa.signInWithEmailAndPassword(au,$("#em").value,$("#pw").value);$("#lerr").textContent=""}catch(x){$("#lerr").textContent="Wrong email or password."}};
$("#lo").onclick=()=>fa.signOut(au);
$("#sv").onclick=async()=>{const j=out();if(!j)return;try{await fb.setDoc(fb.doc(db,"site","content"),{json:j,updated:fb.serverTimestamp()});try{localStorage.removeItem(DK)}catch(e){}OPEN.clear();draw();$("#st").textContent="Saved. Your website now shows these changes."}catch(e){$("#st").textContent="Save failed: "+(e.code||e.message)}};
start();
</script></body></html>
